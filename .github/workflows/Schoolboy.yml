name: Build Module

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.LinkedSquad.SchoolBoyRunaway'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set Target Package
        run: |
          grep -rnwl '.' -e "com\." --include="*.cpp" --include="*.h" | xargs -r sed -i "s/com\.[a-zA-Z0-9_.]*/${{ github.event.inputs.package_name }}/g"
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zygisk-Menu-Output
          path: "**/build/outputs/**"
